<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📋 TaskBoard — Equipo Dealero</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    padding: 16px;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.6rem;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  h1 small {
    font-size: 0.75rem;
    color: #888;
    font-weight: normal;
  }
  .subtitle {
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .agent-filters {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .agent-btn {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    color: #aaa;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .agent-btn:hover { border-color: #555; color: #fff; }
  .agent-btn.active {
    background: #3b82f622;
    border-color: #3b82f6;
    color: #3b82f6;
  }
  .board {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .column {
    background: #1a1a2e;
    border-radius: 12px;
    padding: 14px;
  }
  .column-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid #2a2a4a;
    font-weight: 700;
    font-size: 1rem;
  }
  .column-header .count {
    background: #2a2a4a;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.8rem;
    color: #aaa;
  }
  .column-header .emoji { margin-right: 8px; }
  .backlog .column-header { border-color: #6b7280; }
  .backlog .column-header .emoji { color: #6b7280; }
  .todo .column-header { border-color: #3b82f6; }
  .todo .column-header .emoji { color: #3b82f6; }
  .in-progress .column-header { border-color: #f59e0b; }
  .in-progress .column-header .emoji { color: #f59e0b; }
  .done .column-header { border-color: #22c55e; }
  .done .column-header .emoji { color: #22c55e; }

  .card {
    background: #252540;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-left: 3px solid #3b82f6;
    font-size: 0.85rem;
    line-height: 1.4;
    transition: opacity 0.2s;
  }
  .card:last-child { margin-bottom: 0; }
  .card.priority-urgente { border-left-color: #ef4444; }
  .card.priority-alta { border-left-color: #f59e0b; }
  .card.priority-media { border-left-color: #3b82f6; }
  .card.priority-normal { border-left-color: #6b7280; }
  .card.done-card { border-left-color: #22c55e; opacity: 0.6; }
  .card.done-card .card-title { text-decoration: line-through; }

  .card-title { font-weight: 600; margin-bottom: 2px; }
  .card-meta {
    font-size: 0.7rem;
    color: #888;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
    align-items: center;
  }
  .tag {
    background: #1a1a2e;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 0.65rem;
  }
  .agent-tag {
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 8px;
    font-weight: 600;
  }
  .agent-tag.tony { background: #3b82f622; color: #3b82f6; }
  .agent-tag.jessica { background: #ec489922; color: #ec4899; }
  .agent-tag.marcus { background: #10b98122; color: #10b981; }

  .empty-state {
    color: #555;
    font-size: 0.85rem;
    text-align: center;
    padding: 20px 0;
    font-style: italic;
  }
  .footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #2a2a4a;
    font-size: 0.7rem;
    color: #555;
    text-align: center;
  }
  .loading {
    text-align: center;
    padding: 40px;
    color: #888;
  }
  .error {
    text-align: center;
    padding: 40px;
    color: #ef4444;
  }
  @media (min-width: 768px) {
    .board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
  }
  @media (min-width: 1100px) {
    .board {
      grid-template-columns: 1fr 1fr 1fr 1fr;
    }
  }
</style>
</head>
<body>

<h1>
  📋 TaskBoard
  <small id="lastUpdate"></small>
</h1>
<div class="subtitle">Régulo Salas · Dealero.app · Equipo</div>

<div class="agent-filters" id="filters">
  <button class="agent-btn active" data-agent="all">👥 Todos</button>
  <button class="agent-btn" data-agent="tony">🦾 Tony</button>
  <button class="agent-btn" data-agent="jessica">👩‍💼 Jessica</button>
  <button class="agent-btn" data-agent="marcus">🏋️ Marcus</button>
</div>

<div class="board" id="board">
  <div class="loading">Cargando tareas...</div>
</div>

<div class="footer" id="footer">Cargado desde <strong>taskboard.json</strong></div>

<script>
let currentData = null;
let currentAgent = 'all';

async function loadTasks() {
  const board = document.getElementById('board');
  try {
    const resp = await fetch('./taskboard.json?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    currentData = data;
    renderBoard(data);
  } catch(e) {
    board.innerHTML = `<div class="error">❌ Error al cargar tareas: ${e.message}</div>`;
  }
}

function filterByAgent(tasks, agent) {
  if (agent === 'all') return tasks;
  return tasks.filter(t => t.agent === agent);
}

function renderBoard(data) {
  const now = new Date();
  document.getElementById('lastUpdate').textContent =
    now.toLocaleString('es-US', { timeZone: 'America/New_York', hour12: true,
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  const agents = data.agents || {};

  const columns = [
    { key: 'backlog', emoji: '📦', title: 'Backlog', cls: 'backlog' },
    { key: 'todo', emoji: '📋', title: 'To Do', cls: 'todo' },
    { key: 'in_progress', emoji: '🔄', title: 'In Progress', cls: 'in-progress' },
    { key: 'done', emoji: '✅', title: 'Done', cls: 'done' },
  ];

  const board = document.getElementById('board');
  board.innerHTML = '';

  for (const col of columns) {
    const allTasks = filterByAgent(data[col.key] || [], currentAgent);
    const colDiv = document.createElement('div');
    colDiv.className = `column ${col.cls}`;

    const header = document.createElement('div');
    header.className = 'column-header';
    header.innerHTML = `
      <span><span class="emoji">${col.emoji}</span>${col.title}</span>
      <span class="count">${allTasks.length}</span>
    `;
    colDiv.appendChild(header);

    if (allTasks.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = col.key === 'backlog' ? 'Sin ideas pendientes ✨' :
                          col.key === 'todo' ? 'Todo listo, sin tareas 🎉' :
                          col.key === 'in_progress' ? 'Nada en ejecución 💤' :
                          'Nada completado aún 🔄';
      colDiv.appendChild(empty);
    } else {
      for (const task of allTasks) {
        const card = document.createElement('div');
        const isDone = col.key === 'done';
        const title = task.title || 'tarea';
        const priority = task.priority || 'normal';
        const tags = task.tags || [];
        const created = task.created || null;
        const estimate = task.estimate || null;
        const agent = task.agent || null;

        card.className = `card${isDone ? ' done-card' : ''} priority-${priority}`;

        let metaHtml = '';
        if (agent && agents[agent]) {
          metaHtml += `<span class="agent-tag ${agent}">${agents[agent].avatar} ${agents[agent].name}</span>`;
        }
        if (estimate) metaHtml += `<span>⏱ ${estimate}</span>`;
        if (created) metaHtml += `<span>📅 ${created}</span>`;
        metaHtml += tags.map(t => `<span class="tag">#${t}</span>`).join('');

        card.innerHTML = `
          <div class="card-title">${title}</div>
          <div class="card-meta">${metaHtml}</div>
        `;
        colDiv.appendChild(card);
      }
    }
    board.appendChild(colDiv);
  }
}

// Agent filter buttons
document.getElementById('filters').addEventListener('click', (e) => {
  const btn = e.target.closest('.agent-btn');
  if (!btn) return;
  document.querySelectorAll('.agent-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentAgent = btn.dataset.agent;
  if (currentData) renderBoard(currentData);
});

loadTasks();
setInterval(loadTasks, 60000);
</script>
</body>
</html>
